<style>

<script>
const NS='http://www.w3.org/2000/svg';

function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e}
// ---------- données (valeurs mesurées de l'animation d'origine) ----------
const CB=0.010,VA=10;
const D=[[0,3.42],[1.4,3.91],[2.8,4.19],[4.2,4.40],[5.6,4.59],[7,4.81],[8.4,4.90],[9.8,5.08],[11.2,5.40],[12.6,5.68],[13.3,6.02],[14,8.31],[14.2357,10.6],[14.4714,10.9],[14.9429,11.2],[15.4143,11.3],[15.8857,11.4],[16.3571,11.5],[16.8286,11.6],[17.7714,11.7],[18.7143,11.8],[20.1286,11.9],[21.8571,11.9],[25,11.9]];
function mono(P){const n=P.length,h=[],d=[],m=[];
 for(let i=0;i<n-1;i++){h[i]=P[i+1][0]-P[i][0];d[i]=(P[i+1][1]-P[i][1])/h[i]}
 m[0]=d[0];m[n-1]=d[n-2];for(let i=1;i<n-1;i++)m[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
 for(let i=0;i<n-1;i++){if(d[i]===0){m[i]=m[i+1]=0;continue}const a=m[i]/d[i],b=m[i+1]/d[i],q=a*a+b*b;if(q>9){const t=3/Math.sqrt(q);m[i]=t*a*d[i];m[i+1]=t*b*d[i]}}
 const seg=x=>{let i=0;while(i<n-2&&x>P[i+1][0])i++;return i};
 const F=x=>{if(x<=P[0][0])return P[0][1];if(x>=P[n-1][0])return P[n-1][1];const i=seg(x),t=(x-P[i][0])/h[i],t2=t*t,t3=t2*t;
  return(2*t3-3*t2+1)*P[i][1]+(t3-2*t2+t)*h[i]*m[i]+(-2*t3+3*t2)*P[i+1][1]+(t3-t2)*h[i]*m[i+1]};
 const dF=x=>{if(x<=P[0][0])return m[0];if(x>=P[n-1][0])return 0;const i=seg(x),t=(x-P[i][0])/h[i],t2=t*t;
  return((6*t2-6*t)*P[i][1]+(3*t2-4*t+1)*h[i]*m[i]+(-6*t2+6*t)*P[i+1][1]+(3*t2-2*t)*h[i]*m[i+1])/h[i]};
 return{F,dF}}
const samp=(F,a,b,st)=>{const o=[];let x=a;for(;x<b-1e-9;x+=st)o.push([+x.toFixed(4),F(x)]);o.push([b,F(b)]);return o};
const HC=mono(D),pH=v=>HC.F(v),dH=v=>HC.dF(v);
const dp=i=>i==0||i==D.length-1?null:(D[i+1][1]-D[i-1][1])/(D[i+1][0]-D[i-1][0]);
const pts1=D.map((d,i)=>dp(i)==null?null:[d[0],dp(i)]).filter(Boolean),dmax=Math.max(...pts1.map(p=>p[1])),VBE=pts1.find(p=>p[1]==dmax)[0];
const T1=12.6,slope=dH(T1);let lo=15.0,hi=22.0;for(let k=0;k<60;k++){const mid=(lo+hi)/2;if(dH(mid)>slope)lo=mid;else hi=mid}const T2=(lo+hi)/2;
const b1=pH(T1)-slope*T1,b2=pH(T2)-slope*T2,bm=(b1+b2)/2;
let VBE2=T1;for(let x=T1;x<=T2;x+=.001)if(pH(x)>=slope*x+bm){VBE2=x;break}
const pE=pH(VBE2);
const VBs='V<tspan dy="5" font-size="70%">B</tspan>',VBEs='V<tspan dy="5" font-size="70%">BE</tspan>';

    sl.ov=document.createElement('div');sl.ov.className='ov';el.appendChild(sl.ov)}
  slides.push(sl);return sl}

function heading(sl,html,sub){const h=document.createElement('div');h.className='h';h.innerHTML=html;sl.ov.appendChild(h);
  if(sub){const s=document.createElement('div');s.className='sub';s.innerHTML=sub;sl.ov.appendChild(s)}}
function node(sl,g,o){const n=Object.assign({g,step:0,until:1e9},o);sl.nodes.push(n);return n}
function wline(sl,x1,y1,x2,y2,attrs,o,clipId){
  const id='mk'+(uid++),outer=mk('g',clipId?{'clip-path':'url(#'+clipId+')'}:{},sl.svg),g=mk('g',{},outer);
  mk('line',Object.assign({x1,y1,x2,y2,fill:'none'},attrs),g);

  const ml=mk('line',{x1,y1,x2,y2,stroke:'#fff','stroke-width':40,pathLength:1,'stroke-dasharray':'1 1'},mask);
  g.setAttribute('mask','url(#'+id+')');return node(sl,g,Object.assign({ml},o))}
function wpoly(sl,points,attrs,o){const pl=mk('polyline',Object.assign({points,fill:'none',pathLength:1,'stroke-dasharray':'1 1'},attrs),sl.svg);return node(sl,pl,Object.assign({path:pl},o))}

const txt=(x,y,h,st,an)=>`<text x="${x}" y="${y}" ${an?'text-anchor="'+an+'"':''} style="${st||''}">${h}</text>`;
const dots=(arr,X,Y,c)=>arr.map(d=>`<circle cx="${X(d[0])}" cy="${Y(d[1])}" r="3.5" fill="${c}"/>`).join('');

// ---------- 1. titre ----------
titleSlide(['Titrage pH-métrique','d’une solution d’acide éthanoïque','par une solution d’hydroxyde de sodium (soude)']);

{const sl=addSlide('diagram',4);
 heading(sl,'Protocole du titrage','Déterminer la concentration inconnue c<sub>A</sub> d’une solution d’acide éthanoïque (solution titrée) à l’aide d’une solution de soude (solution titrante) de concentration c<sub>B</sub> connue.');
 const B=[{x:40,y:165,t:'Étalonnage du pH-mètre',l:['Se munir de deux solutions tampon adaptées.','Mesurer la température des solutions et la régler sur le pH-mètre.','Enlever le capuchon, rincer l’électrode et la sécher délicatement avec un papier absorbant.','Afficher le pH de la solution tampon avec le bouton de réglage ; rincer et sécher l’électrode entre chaque tampon.']},
 {x:500,y:165,t:'Préparation du titrage',l:['Prélever V<sub>A</sub> = 10,0 mL d’acide éthanoïque à la pipette jaugée (consignes de sécurité !) et les placer dans un bécher.','Ajouter environ 20 mL d’eau distillée pour immerger complètement la sonde : cet ajout ne modifie pas le résultat du titrage.','Remplir la burette (préalablement rincée) avec la solution de soude de concentration c<sub>B</sub>.']},
 {x:40,y:440,t:'Titrage',l:['Déposer le bécher muni d’un turbulent sur l’agitateur magnétique, introduire la sonde et mettre l’agitation en marche.','Verser progressivement le réactif titrant et relever le pH.']},
 {x:500,y:440,t:'Rangement',l:['Éteindre le pH-mètre, arrêter l’agitation, rincer l’électrode, protéger la sonde et ranger le pH-mètre.']}];
 B.forEach((b,i)=>{const d=document.createElement('div');d.className='blk';d.style.left='calc(var(--u)*'+b.x+')';d.style.top='calc(var(--u)*'+b.y+')';
  d.innerHTML='<h3>'+(i+1)+'. '+b.t+'</h3><ul>'+b.l.map(x=>'<li>'+x+'</li>').join('')+'</ul>';sl.ov.appendChild(d);node(sl,d,{step:i+1})})}

// ---------- 3. titre ----------
titleSlide(['Réalisation','du titrage pH-métrique']);

(function(){

function apply(n,vis){

  else n.g.style.opacity=vis?1:0}
function play(n){const o={duration:n.dur||500,fill:'backwards',easing:'linear'};
  if(n.ml)n.ml.animate([{strokeDashoffset:1},{strokeDashoffset:0}],o);

  else n.g.animate([{opacity:0},{opacity:1}],o)}
